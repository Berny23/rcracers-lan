; rclan - LAN multiplayer mod for 3-D Ultra Radio Control Racers Deluxe
; Settings file: <game folder>\scripts\rclan.ini. Every key is optional;
; deleting a line restores its default. Comments must be on their own line.

[LAN]
; 1 = show the network panel next to the main menu, 0 = hide it
Enabled=1
; Your player name (default: the game's Player 1 profile name)
;Name=
; Panel language: de or en (default: the game's menu language)
;Language=
; TCP port of the session; LAN discovery uses UDP on Port-1 (47624)
Port=47625
; Last address typed into the panel (written by the panel)
LastAddress=

[Window]
; 1 = borderless fullscreen layout with the menu bar drawn by the mod
FixLayout=1
; 1 = Wine's own menu bar instead of the drawn one
NativeMenuBar=0
; 1 = steady repaints in the menus (prevents adaptive sync flicker)
SteadyRefresh=1
; 1 = races in a window (needed for the scaled view), 0 = game's fullscreen mode
WindowedRace=1
; 1 = races scaled to fill the screen (4:3), 0 = the game's own size
ScaleRace=1

[Game]
; 1 = skip the intro video
SkipIntro=0

[Race]
; The host's race options, written by the panel.
; Race type: 0 single race, 1 Funkduell (2 players), 2 championship
Type=0
; Track number in the game's track list (single race)
Track=0
; Championship: 0 Amateur, 1 Pro, 2 Custom, 3 Super
Circuit=0
; Custom championship tracks, e.g. backyard,raceway,aztec
Custom=
; Funkduell game: 0 radio soccer, 1 battle ball
Game=0
; Race length counts: 0 laps, 1 minutes (Funkduell: always minutes)
Minutes=0
; Race length, 1-10
Length=3
; 1 = power-ups on
PowerUps=1
; 1 = track sheriff on
Sheriff=1
; 1 = hard (realistic steering, strong opponents), 0 = easy
Hard=1
; 1 = fill empty slots with computer opponents
Bots=1

[Debug]
; 1 = run test commands from <game folder>\rclan_cmd.txt
Automation=0
; 1 = dump car states during network races (rclan_dump_*.bin)
RaceDump=0
